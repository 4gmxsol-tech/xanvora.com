<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Xanvora — AI World Prototype</title>
  <meta name="description" content="Xanvora is an experimental AI-native 3D world running in the browser.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="brand">
      <div class="logo">XANVORA</div>
      <div class="tagline">AI-native world prototype</div>
    </div>
    <div class="help">WASD / Arrow keys to move · Click the robot · Enter a world command</div>
    <div class="panel">
      <div class="panel-title">World Command</div>
      <form id="command-form">
        <input id="command" autocomplete="off" placeholder='Try: "Build a house near the tree"'>
        <button type="submit">Run</button>
      </form>
      <div id="status">World ready.</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
